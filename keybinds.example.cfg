; Theocracy Options Mod - gameplay binding reference
; Target: Steam theocracy-0.6.85.exe, app 4834790
; Stock defaults confirmed in the game are recorded here by context.
; Add actions as they are verified. Unknown actions are left out.
; Keep Defaults as the stock reference. Supported gameplay Overrides are saved by the mod.
;
; Controls uses the gameplay override for supported actions if present,
; otherwise use Defaults. Revert to Default clears pending overrides.
; OK saves the result. Cancel discards pending changes.

[Defaults.StartupVideo]
; Verified during launch testing of the original opening sequence.
SkipOpeningVideo=Escape

[Defaults.TitleMenu]
; Verified on the game's native title-screen controls.
ActivatePointedItem=MouseLeft

[Defaults.Dialog]
; Reported in-game. Escape follows the active dialog's own close behavior.
CloseActiveDialog=Escape

